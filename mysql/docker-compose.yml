version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Lbs990129...
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    volumes:
      - /root/mysqlData:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password