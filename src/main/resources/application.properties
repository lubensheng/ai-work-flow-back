# 应用名称 (你原来的)
spring.application.name=ai-work-flow-back

# =====================  数据库配置 =====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ai-business?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Lbs990129..

# ===================== MyBatis-Plus 配置 =====================
# 实体类所在包（改成你自己的包名.entity）
mybatis-plus.type-aliases-package=com.example.aiworkflowback.User.Model.Entity
# 开启驼峰命名自动映射（数据库user_name → 实体userName）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 打印执行的SQL（方便调试）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath:mapper/*.xml