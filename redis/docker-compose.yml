services:
  redis:
    image: redis:7.2
    container_name: redis-server
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass Lbs990129...
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge